name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml==6.0.2 jsonschema==4.23.0
      - name: Validate checklist.yaml against schema and ID rules
        run: python scripts/validate.py
      - name: Check generated files are up to date
        run: python scripts/build.py --check
      - name: Check CSV parses
        run: python -c "import csv; rows=list(csv.DictReader(open('checklist.csv'))); assert rows, 'empty csv'; print(len(rows), 'rows')"
